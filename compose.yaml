services:
  slideshow:
    image: ghcr.io/birdy1974/slideshow:latest
    container_name: slideshow
    restart: unless-stopped
    # DSM's default first-user IDs are commonly 1026:100. Change these values
    # to the owner of your mounted folders (`id YOUR_USERNAME` over SSH).
    user: "${PUID:-1026}:${PGID:-100}"
    ports:
      - "${SLIDESHOW_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-Europe/Amsterdam}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RENDER_WORKERS: "${RENDER_WORKERS:-1}"
      UPLOADS_DIR: /uploads
      UPLOAD_MAX_MB: "${UPLOAD_MAX_MB:-4096}"
    volumes:
      - "${CONFIG_PATH:-./data/config}:/config"
      - "${PHOTOS_PATH:-./data/photos}:/photos:ro"
      - "${VIDEOS_PATH:-./data/videos}:/videos:ro"
      - "${MUSIC_PATH:-./data/music}:/music:ro"
      - "${OUTPUT_PATH:-./data/output}:/output"
      # Files uploaded from the GUI device ("Upload from this device" in the
      # media picker). Kept separate from renders and from the read-only mounts.
      # Create this host folder yourself and chown it to PUID:PGID — if Docker
      # creates it on first start it is root-owned and uploads are refused
      # (the picker then shows "uploads folder is not writable").
      - "${UPLOADS_PATH:-./data/uploads}:/uploads"
    # Hardware encoding: Intel Quick Sync and/or VA-API share this device.
    # Remove this section if /dev/dri does not exist; Auto encoding then
    # safely uses CPU/libx264.
    devices:
      - /dev/dri:/dev/dri
    # Set VIDEO_GID to the numeric group shown by `ls -ln /dev/dri`.
    group_add:
      - "${VIDEO_GID:-937}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Liveness probes hit /api/ping (dependency-free, answers in
      # milliseconds even mid-render). /api/health probes ffmpeg/Quick Sync
      # and is meant for the UI — using it here made Portainer report a
      # healthy, busy container as "unhealthy".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
