<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Slideshow — Photo &amp; Video Studio">
  <!-- Hairline ring appears only on dark browser chrome so the ink tile stays visible. -->
  <style>
    .ring { fill: none; stroke: #c9ed6d; stroke-width: 0; }
    @media (prefers-color-scheme: dark) { .ring { stroke-width: 1.4; } }
  </style>
  <rect x="0.7" y="0.7" width="30.6" height="30.6" rx="7.6" class="ring"/>
  <rect width="32" height="32" rx="8" fill="#20231f"/>
  <!-- Simplified film frame echoing the .brand-mark glyph (rotate -3deg). -->
  <g transform="translate(16 16) rotate(-3) translate(-16 -16) translate(6.1 6.1) scale(0.825)" fill="none" stroke="#c9ed6d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <path d="M7 3v18"/>
    <path d="M17 3v18"/>
    <path d="M3 12h18"/>
  </g>
</svg>
